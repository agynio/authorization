name: Authorization Model Tests
model_file: model.fga
tuples:
  - user: "identity:admin-user-id"
    relation: admin
    object: "cluster:global"
  - user: "identity:org-owner-id"
    relation: owner
    object: "organization:org-1"
  - user: "identity:org-member-id"
    relation: member
    object: "organization:org-1"
  - user: "cluster:global"
    relation: cluster
    object: "organization:org-1"
  - user: "identity:app-installed-id"
    relation: thread_create
    object: "organization:org-1"
  - user: "identity:app-installed-id"
    relation: thread_write
    object: "organization:org-1"
  - user: "identity:app-installed-id"
    relation: participant_add
    object: "organization:org-1"
  - user: "identity:app-installed-id"
    relation: inbox_write
    object: "organization:org-1"
  - user: "organization:org-1"
    relation: org
    object: "thread:thread-1"
  - user: "identity:thread-participant-id"
    relation: participant
    object: "thread:thread-1"
  - user: "organization:org-1"
    relation: org
    object: "workload:workload-1"
  - user: "identity:workload-owner-agent-id"
    relation: owner_agent
    object: "workload:workload-1"
  - user: "organization:org-1"
    relation: org
    object: "sandbox:sandbox-1"
  - user: "identity:sandbox-owner-id"
    relation: owner
    object: "sandbox:sandbox-1"
  - user: "organization:org-1"
    relation: org
    object: "sandbox:org-owner-owned-sandbox"
  - user: "identity:org-owner-id"
    relation: owner
    object: "sandbox:org-owner-owned-sandbox"
  - user: "organization:org-1"
    relation: org
    object: "model:model-1"
  - user: "organization:org-1"
    relation: org
    object: "agent:internal-agent"
  - user: "organization:org-1"
    relation: internal_access
    object: "agent:internal-agent"
  - user: "organization:org-1"
    relation: org
    object: "agent:private-agent"
  - user: "identity:agent-owner-id"
    relation: owner
    object: "agent:private-agent"
  - user: "identity:agent-maintainer-id"
    relation: maintainer
    object: "agent:private-agent"
  - user: "identity:agent-participant-id"
    relation: participant
    object: "agent:private-agent"
  - user: "organization:org-1"
    relation: org
    object: "group:platform-team"
  - user: "identity:group-member-id"
    relation: member
    object: "group:platform-team"
  - user: "identity:group-admin-id"
    relation: admin
    object: "group:platform-team"
  - user: "organization:org-1"
    relation: org
    object: "group:agent-maintainers"
  - user: "identity:agent-maintainer-group-member-id"
    relation: member
    object: "group:agent-maintainers"
  - user: "group:agent-maintainers#member"
    relation: maintainer
    object: "agent:private-agent"
  - user: "organization:org-1"
    relation: org
    object: "group:agent-participants"
  - user: "identity:agent-participant-group-member-id"
    relation: member
    object: "group:agent-participants"
  - user: "group:agent-participants#member"
    relation: participant
    object: "agent:private-agent"
  - user: "agent:private-agent"
    relation: class
    object: "agent_instance:private-instance"
  - user: "organization:org-1"
    relation: org
    object: "agent_instance:private-instance"
  - user: "agent:internal-agent"
    relation: class
    object: "agent_instance:internal-instance"
  - user: "organization:org-1"
    relation: org
    object: "agent_instance:internal-instance"
  - user: "identity:direct-inbox-writer-id"
    relation: can_write_inbox
    object: "agent_instance:private-instance"
  - user: "organization:org-1"
    relation: org
    object: "group:inbox-writers"
  - user: "identity:inbox-writer-group-member-id"
    relation: member
    object: "group:inbox-writers"
  - user: "group:inbox-writers#member"
    relation: can_write_inbox
    object: "agent_instance:private-instance"
  - user: "organization:org-1"
    relation: org
    object: "environment:internal-environment"
  - user: "organization:org-1"
    relation: internal_access
    object: "environment:internal-environment"
  - user: "organization:org-1"
    relation: org
    object: "environment:private-environment"
  - user: "identity:environment-owner-id"
    relation: owner
    object: "environment:private-environment"
  - user: "identity:environment-maintainer-id"
    relation: maintainer
    object: "environment:private-environment"
  - user: "identity:environment-user-id"
    relation: user
    object: "environment:private-environment"
  - user: "identity:private-instance"
    relation: instance
    object: "agent:private-agent"
  - user: "agent:private-agent"
    relation: agent
    object: "environment:private-environment"
  - user: "identity:sandbox-1"
    relation: holder
    object: "sandbox:sandbox-1"
  - user: "sandbox:sandbox-1"
    relation: sandbox
    object: "environment:private-environment"
tests:
  - name: cluster admin can admin cluster
    check:
      - user: "identity:admin-user-id"
        object: "cluster:global"
        assertions:
          admin: true
  - name: non-admin cannot admin cluster
    check:
      - user: "identity:org-owner-id"
        object: "cluster:global"
        assertions:
          admin: false
  - name: org owner inherits org permissions
    check:
      - user: "identity:org-owner-id"
        object: "organization:org-1"
        assertions:
          owner: true
          member: true
          can_invite: true
          can_manage_members: true
          can_view_threads: true
          can_view_workloads: true
          can_view_volumes: true
          can_create_thread: true
          can_create_sandbox: true
          can_list_sandboxes: true
  - name: org member has limited org permissions
    check:
      - user: "identity:org-member-id"
        object: "organization:org-1"
        assertions:
          owner: false
          member: true
          can_invite: false
          can_manage_members: false
          can_view_threads: false
          can_view_workloads: false
          can_view_volumes: false
          can_create_thread: true
          can_create_sandbox: true
          can_list_sandboxes: false
  - name: cluster admin can add and manage org members
    check:
      - user: "identity:admin-user-id"
        object: "organization:org-1"
        assertions:
          can_add_member: true
          can_manage_members: true
          can_view_threads: true
          can_view_workloads: true
          can_view_volumes: true
          can_create_sandbox: false
          can_list_sandboxes: true
  - name: non-admin cannot add org members
    check:
      - user: "identity:org-owner-id"
        object: "organization:org-1"
        assertions:
          can_add_member: false
  - name: installed app has org app permissions
    check:
      - user: "identity:app-installed-id"
        object: "organization:org-1"
        assertions:
          thread_create: true
          thread_write: true
          participant_add: true
          inbox_write: true
          can_create_thread: true
  - name: uninstalled app lacks org app permissions
    check:
      - user: "identity:app-uninstalled-id"
        object: "organization:org-1"
        assertions:
          thread_create: false
          thread_write: false
          participant_add: false
          inbox_write: false
          can_create_thread: false
  - name: thread participant can read write add
    check:
      - user: "identity:thread-participant-id"
        object: "thread:thread-1"
        assertions:
          can_read: true
          can_write: true
          can_add_participant: true
  - name: org owner can read thread
    check:
      - user: "identity:org-owner-id"
        object: "thread:thread-1"
        assertions:
          can_read: true
          can_write: false
          can_add_participant: false
  - name: cluster admin can read thread
    check:
      - user: "identity:admin-user-id"
        object: "thread:thread-1"
        assertions:
          can_read: true
          can_write: false
          can_add_participant: false
  - name: installed app can write and add to thread
    check:
      - user: "identity:app-installed-id"
        object: "thread:thread-1"
        assertions:
          can_read: false
          can_write: true
          can_add_participant: true
  - name: workload owner agent can view own workload
    check:
      - user: "identity:workload-owner-agent-id"
        object: "workload:workload-1"
        assertions:
          owner_agent: true
          can_view: true
      - user: "identity:app-installed-id"
        object: "workload:workload-1"
        assertions:
          owner_agent: false
          can_view: false
  - name: org roles derive workload view access
    check:
      - user: "identity:org-owner-id"
        object: "workload:workload-1"
        assertions:
          can_view: true
      - user: "identity:admin-user-id"
        object: "workload:workload-1"
        assertions:
          can_view: true
      - user: "identity:org-member-id"
        object: "workload:workload-1"
        assertions:
          can_view: false
  - name: sandbox owner can connect stop and delete own sandbox
    check:
      - user: "identity:sandbox-owner-id"
        object: "sandbox:sandbox-1"
        assertions:
          owner: true
          can_connect: true
          can_stop: true
          can_delete: true
          can_list_all: false
          can_read: true
  - name: org owner can manage but not connect to non-owned sandbox
    check:
      - user: "identity:org-owner-id"
        object: "sandbox:sandbox-1"
        assertions:
          owner: false
          can_connect: false
          can_stop: true
          can_delete: true
          can_list_all: true
          can_read: true
  - name: org member cannot access another member sandbox
    check:
      - user: "identity:org-member-id"
        object: "sandbox:sandbox-1"
        assertions:
          owner: false
          can_connect: false
          can_stop: false
          can_delete: false
          can_list_all: false
          can_read: false
  - name: org owner can connect only to own sandbox
    check:
      - user: "identity:org-owner-id"
        object: "sandbox:org-owner-owned-sandbox"
        assertions:
          owner: true
          can_connect: true
          can_stop: true
          can_delete: true
          can_list_all: true
          can_read: true
  - name: unrelated identity cannot access sandbox
    check:
      - user: "identity:agent-role-non-member-id"
        object: "sandbox:sandbox-1"
        assertions:
          owner: false
          can_connect: false
          can_stop: false
          can_delete: false
          can_list_all: false
          can_read: false
  - name: model permissions derive from org roles
    check:
      - user: "identity:org-owner-id"
        object: "model:model-1"
        assertions:
          can_manage: true
          can_use: true
      - user: "identity:org-member-id"
        object: "model:model-1"
        assertions:
          can_manage: false
          can_use: true
      - user: "identity:app-installed-id"
        object: "model:model-1"
        assertions:
          can_manage: false
          can_use: false
  - name: internal agent can be initiated by org member
    check:
      - user: "identity:org-member-id"
        object: "agent:internal-agent"
        assertions:
          can_initiate: true
          can_read_config: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:app-installed-id"
        object: "agent:internal-agent"
        assertions:
          can_initiate: false
  - name: private agent requires agent role to initiate
    check:
      - user: "identity:org-member-id"
        object: "agent:private-agent"
        assertions:
          can_initiate: false
      - user: "identity:agent-participant-id"
        object: "agent:private-agent"
        assertions:
          can_initiate: true
          can_read_config: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:agent-participant-group-member-id"
        object: "agent:private-agent"
        assertions:
          participant: true
          can_initiate: true
          can_read_config: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:agent-maintainer-id"
        object: "agent:private-agent"
        assertions:
          can_initiate: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: false
          can_delete: false
      - user: "identity:agent-maintainer-group-member-id"
        object: "agent:private-agent"
        assertions:
          maintainer: true
          can_initiate: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: false
          can_delete: false
      - user: "identity:agent-role-non-member-id"
        object: "agent:private-agent"
        assertions:
          participant: false
          maintainer: false
          owner: false
          can_initiate: false
          can_read_config: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:agent-owner-id"
        object: "agent:private-agent"
        assertions:
          can_initiate: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: true
          can_delete: true
  - name: agent instance permissions derive from class and inbox grants
    check:
      - user: "identity:agent-participant-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: true
          can_manage: false
          can_write_inbox: false
      - user: "identity:agent-owner-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: true
          can_manage: true
          can_write_inbox: false
      - user: "identity:org-owner-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: true
          can_manage: true
          can_write_inbox: false
      - user: "identity:org-member-id"
        object: "agent_instance:internal-instance"
        assertions:
          can_initiate: true
          can_manage: false
          can_write_inbox: false
      - user: "identity:app-installed-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: false
          can_manage: false
          can_write_inbox: true
      - user: "identity:direct-inbox-writer-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: false
          can_manage: false
          can_write_inbox: true
      - user: "identity:inbox-writer-group-member-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: false
          can_manage: false
          can_write_inbox: true
      - user: "identity:agent-role-non-member-id"
        object: "agent_instance:private-instance"
        assertions:
          can_initiate: false
          can_manage: false
          can_write_inbox: false
  - name: group permissions derive from membership and org roles
    check:
      - user: "identity:group-member-id"
        object: "group:platform-team"
        assertions:
          member: true
          can_view: true
          can_edit: false
      - user: "identity:org-member-id"
        object: "group:platform-team"
        assertions:
          member: false
          can_view: true
          can_edit: false
      - user: "identity:group-admin-id"
        object: "group:platform-team"
        assertions:
          admin: true
          can_view: false
          can_edit: true
      - user: "identity:org-owner-id"
        object: "group:platform-team"
        assertions:
          member: false
          can_view: true
          can_edit: true
      - user: "identity:agent-role-non-member-id"
        object: "group:platform-team"
        assertions:
          member: false
          admin: false
          can_view: false
          can_edit: false
  - name: org owner has owner-level capabilities on agents
    check:
      - user: "identity:org-owner-id"
        object: "agent:private-agent"
        assertions:
          owner: false
          can_initiate: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: true
          can_delete: true
  - name: any organization member may author an environment
    check:
      - user: "identity:org-member-id"
        object: "organization:org-1"
        assertions:
          can_create_environment: true
      - user: "identity:org-owner-id"
        object: "organization:org-1"
        assertions:
          can_create_environment: true
      - user: "identity:agent-role-non-member-id"
        object: "organization:org-1"
        assertions:
          can_create_environment: false
  - name: an internal environment may be used by any organization member
    check:
      - user: "identity:org-member-id"
        object: "environment:internal-environment"
        assertions:
          can_use: true
          can_read_config: false
          can_edit_config: false
  - name: a private environment reaches only its role holders
    check:
      - user: "identity:org-member-id"
        object: "environment:private-environment"
        assertions:
          can_use: false
          can_read_config: false
      - user: "identity:environment-user-id"
        object: "environment:private-environment"
        assertions:
          can_use: true
          can_read_config: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:environment-maintainer-id"
        object: "environment:private-environment"
        assertions:
          can_use: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: false
          can_delete: false
      - user: "identity:environment-owner-id"
        object: "environment:private-environment"
        assertions:
          can_use: true
          can_read_config: true
          can_edit_config: true
          can_manage_roles: true
          can_delete: true
  - name: a running instance reads the config it was started from
    check:
      - user: "identity:private-instance"
        object: "agent:private-agent"
        assertions:
          can_read_config: true
          can_edit_config: false
          can_initiate: false
          can_manage_roles: false
          can_delete: false
      - user: "identity:private-instance"
        object: "environment:private-environment"
        assertions:
          can_read_config: true
          can_use: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      # The grant follows the instance's own agent, not every agent it can see.
      - user: "identity:private-instance"
        object: "agent:internal-agent"
        assertions:
          can_read_config: false
      - user: "identity:private-instance"
        object: "environment:internal-environment"
        assertions:
          can_read_config: false
      - user: "identity:internal-instance"
        object: "environment:private-environment"
        assertions:
          can_read_config: false
  - name: a sandbox holder reads its own environment config and nothing more
    check:
      - user: "identity:sandbox-1"
        object: "environment:private-environment"
        assertions:
          can_read_config: true
          can_use: false
          can_edit_config: false
          can_manage_roles: false
          can_delete: false
      # The grant follows the sandbox's own environment, not every one it sees.
      - user: "identity:sandbox-1"
        object: "environment:internal-environment"
        assertions:
          can_read_config: false
      # Holding is not owning: the workload reads config, the person connects.
      - user: "identity:sandbox-1"
        object: "sandbox:sandbox-1"
        assertions:
          can_connect: false
          can_delete: false
      - user: "identity:sandbox-owner-id"
        object: "environment:private-environment"
        assertions:
          can_read_config: false
  - name: org owner retains administrative access to every environment
    check:
      - user: "identity:org-owner-id"
        object: "environment:private-environment"
        assertions:
          owner: false
          can_read_config: true
          can_edit_config: true
          can_manage_roles: true
          can_delete: true
